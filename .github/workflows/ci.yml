name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ato-tau2 --help
      - run: ato-terminal --help
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  metaflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[metaflow]"
      - run: python harness/run_harness_metaflow.py show
      - run: python harness/run_harness_metaflow.py run --benchmark synthetic --output-dir "$RUNNER_TEMP/ato-metaflow-smoke"
      - run: python -c 'import json, os; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"])/"ato-metaflow-smoke"; d=json.loads((root/"summary.json").read_text()); assert d["optimization"]["status"] == "candidate_applied"; assert d["comparison"]["test"]["avg_reward_delta"] == 1.0; assert all((root/f"{phase}.json").is_file() for phase in ("baseline_train", "baseline_test", "optimized_train", "optimized_test"))'
      - run: python -c 'from metaflow import Flow; r=Flow("ToolOptimizationHarness").latest_successful_run; assert r is not None and r.data.summary["optimization"]["status"] == "candidate_applied"'
      - name: Verify datastore-only output and run-ID baseline reuse
        run: |
          python harness/run_harness_metaflow.py run --benchmark synthetic --artifact-only --skip-optimize
          baseline_run_id=$(python -c 'from metaflow import Flow; print(Flow("ToolOptimizationHarness").latest_successful_run.id)')
          python harness/run_harness_metaflow.py run --benchmark synthetic --artifact-only --baseline-run-id "$baseline_run_id"
          python -c 'from metaflow import Flow; r=Flow("ToolOptimizationHarness").latest_successful_run; d=r.data; assert d.run_dir == ""; assert d.summary["optimization"]["status"] == "candidate_applied"; assert d.summary["baseline_source"].endswith("/" + d.baseline_run_id); assert d.candidates[0].files["tool.txt"] == "edited"; assert d.optimized_artifacts[0]["optimized_test"]["avg_reward"] == 1.0; assert "<html" in d.report_html'
