name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ato-tau2 --help
      - run: ato-terminal --help
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  metaflow-local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[metaflow]"
      - run: python examples/metaflow_local_smoke.py show
      - run: python examples/metaflow_local_smoke.py run --output-dir "$RUNNER_TEMP/ato-metaflow-smoke"
      - run: python -c 'import json, os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"ato-metaflow-smoke"/"summary.json"; d=json.loads(p.read_text()); assert d["optimization"]["status"] == "candidate_applied"; assert d["comparison"]["test"]["avg_reward_delta"] == 1.0'
      - run: python -c 'from metaflow import Flow; r=Flow("PublicAdapterSmoke").latest_successful_run; assert r is not None and r.data.summary["optimization"]["status"] == "candidate_applied"'
